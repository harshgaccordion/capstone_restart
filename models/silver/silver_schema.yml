version: 2

models:

  - name: silver__customer_data
    description: "Standardized customer records prepared for analytics and reporting."

    columns:

      - name: customer_id
        description: "Natural identifier assigned to each customer."
        tests:
          - not_null
          - unique


  - name: silver__product_data
    description: "Current standardized product records containing hierarchy, pricing, inventory, supplier details, and calculated metrics."

    columns:

      - name: product_id
        description: "Natural identifier for the product."
        tests:
          - not_null
          - unique


  - name: silver__product_history_data
    description: "Historical product snapshot records used to track inventory changes across source snapshot dates."

    columns:

      - name: product_history_key
        description: "Unique surrogate identifier for a product snapshot."
        tests:
          - not_null
          - unique

      - name: product_id
        description: "Natural identifier of the associated product."
        tests:
          - not_null

      - name: source_snapshot_date
        description: "Date corresponding to the product source snapshot."
        tests:
          - not_null


  - name: silver__order_items_data
    description: "Standardized order-line records supporting sales, inventory, and downstream fact-table calculations."

    columns:

      - name: order_item_key
        description: "Surrogate identifier for an order line."
        tests:
          - not_null
          - unique

      - name: order_id
        description: "Natural identifier of the associated order."
        tests:
          - not_null

      - name: product_id
        description: "Identifier of the product included in the order line."
        tests:
          - not_null

      - name: quantity
        description: "Number of product units included in the order line."


  - name: silver__orders_data
    description: "Standardized order-level records containing aggregated item details, profitability measures, timing information, and delivery metrics."

    columns:

      - name: order_id
        description: "Natural identifier assigned to each order."
        tests:
          - not_null
          - unique


  - name: silver__store_data
    description: "Standardized store records containing location details, store classifications, age information, and performance measures."

    columns:

      - name: store_id
        description: "Natural identifier for the store."
        tests:
          - not_null
          - unique


  - name: silver__supplier_data
    description: "Standardized supplier records covering identity, contact details, payment conditions, and supplier classification."

    columns:

      - name: supplier_id
        description: "Natural identifier assigned to the supplier."
        tests:
          - not_null
          - unique


  - name: silver__employee_data
    description: "Standardized employee records prepared for reporting and store-level analysis."

    columns:

      - name: employee_id
        description: "Natural identifier assigned to the employee."
        tests:
          - not_null
          - unique


  - name: silver__campaign_data
    description: "Standardized marketing campaign records containing duration, audience segmentation, and financial performance information."

    columns:

      - name: campaign_id
        description: "Natural identifier for the marketing campaign."
        tests:
          - not_null
          - unique


  - name: silver__inventory_data
    description: "Product inventory positions calculated from historical snapshots and completed order-line sales."

    columns:

      - name: inventory_key
        description: "Surrogate identifier for a product inventory position on a given date."
        tests:
          - not_null
          - unique

      - name: product_id
        description: "Identifier of the product represented by the inventory record."
        tests:
          - not_null

      - name: inventory_date
        description: "Date represented by the inventory snapshot."
        tests:
          - not_null

      - name: beginning_stock
        description: "Ending stock recorded in the preceding product snapshot."

      - name: purchased_quantity
        description: "Estimated quantity purchased based on beginning stock, ending stock, and units sold."

      - name: sold_quantity
        description: "Units sold through completed or delivered orders."

      - name: ending_stock
        description: "Inventory quantity recorded for the current snapshot."

      - name: inventory_value
        description: "Monetary value of ending inventory based on product cost."

      - name: stock_turnover_ratio
        description: "Ratio of units sold to average inventory."

      - name: reorder_level
        description: "Minimum inventory threshold defined for replenishment."

      - name: supplier_id
        description: "Identifier of the supplier associated with the product."

      - name: snapshot_gap_flag
        description: "Boolean indicator showing whether a gap exists between consecutive inventory snapshots."

      - name: snapshot_gap_days
        description: "Elapsed days between the previous snapshot and the current inventory date."

      - name: low_stock_flag
        description: "Boolean indicator showing whether ending inventory is below the defined reorder threshold."

      - name: negative_inferred_purchase_flag
        description: "Boolean indicator showing whether the calculated purchased quantity is negative."