version: 2

sources:
  - name: bronze
    database: CT_HARSH_GOYAL_DB
    schema: EXTERNAL
    loaded_at_field: FILE_LAST_MODIFIED
    freshness:
      warn_after: {count: 1, period: day}
      error_after: {count: 200, period: day}

      
    tables:
      - name: campaign_data
        identifier: CAMPAIGN_DATA_EXT
      - name: customer_data
        identifier: CUSTOMER_DATA_EXT
      - name: employee_data
        identifier: EMPLOYEE_DATA_EXT
      - name: order_data
        identifier: ORDERS_DATA_EXT
      - name: product_data
        identifier: PRODUCT_DATA_EXT
        freshness:
          warn_after: {count: 12, period: day}
          error_after: {count: 200, period: day}
      - name: store_data
        identifier: STORE_DATA_EXT
      - name: supplier_data
        identifier: SUPPLIER_DATA_EXT